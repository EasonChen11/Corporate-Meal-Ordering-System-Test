<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Corporate Meal Ordering System</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f8fa;
        color: #1f2937;
      }

      main {
        width: min(720px, calc(100% - 32px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        font-size: 16px;
        line-height: 1.6;
      }

      .deploy-marker {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 12px 16px;
        text-align: center;
        font-weight: 600;
        font-size: 14px;
        color: #1e3a8a;
        background: #dbeafe;
        border-bottom: 2px solid #3b82f6;
      }

      .deploy-marker .version {
        display: inline-block;
        margin-left: 8px;
        padding: 2px 8px;
        background: #1e3a8a;
        color: white;
        border-radius: 999px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="deploy-marker">
      🚀 TBD demo — release candidate
      <span class="version">v0.2.0</span>
    </div>
    <main>
      <h1>Corporate Meal Ordering System</h1>
      <p>團隊共用開發環境已建立。後續可以在這裡接上前端框架與訂餐流程。</p>
    </main>
  </body>
</html>
